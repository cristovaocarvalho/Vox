appId: com.vox.app
productName: Vox
directories:
  output: dist-build
publish:
  provider: github
  owner: cristovaocarvalho
  repo: Vox
files:
  - "out/**/*"
extraResources:
  - from: resources/models/
    to: models/
    filter: ["**/*"]
  - from: src/assets/Logo-Vox1.ico
    to: Logo-Vox1.ico
win:
  icon: src/assets/Logo-Vox1.ico
  target:
    - dir
    - nsis
nsis:
  artifactName: "Vox Setup.${ext}"
  uninstallDisplayName: "Vox"
  shortcutName: "Vox"
  installerIcon: src/assets/Logo-Vox1.ico
  uninstallerIcon: src/assets/Logo-Vox1.ico
  installerHeaderIcon: src/assets/Logo-Vox1.ico
  installerSidebar: resources/installer/installerSidebar.bmp
  uninstallerSidebar: resources/installer/uninstallerSidebar.bmp
  installerHeader: resources/installer/installerHeader.bmp
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**/*"
