appId: com.vox.app
productName: Vox
afterPack: scripts/afterPack.js
directories:
  output: dist-build
publish:
  provider: github
  owner: cristovaocarvalho
  repo: Vox
files:
  - "out/**/*"
extraResources:
  - from: resources/models/
    to: models/
    filter: ["**/*"]
  - from: resources/win-key-helper.exe
    to: win-key-helper.exe
  - from: src/assets/Logo-Vox1.ico
    to: Logo-Vox1.ico
  - from: src/assets/logo.png
    to: logo.png
mac:
  icon: src/assets/logo.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Vox precisa de acesso ao microfone para transcrever e ditar sua voz em tempo real."
    NSAppleEventsUsageDescription: "Vox precisa de controle de eventos do sistema para digitar e colar texto no seu aplicativo ativo."
    NSSpeechRecognitionUsageDescription: "Vox utiliza reconhecimento de fala para converter suas palavras em texto."
dmg:
  artifactName: "Vox-macOS-${arch}.${ext}"
  title: "Vox Installer"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  icon: src/assets/Logo-Vox1.ico
  target:
    - dir
    - nsis
nsis:
  artifactName: "Vox-Setup.${ext}"
  uninstallDisplayName: "Vox"
  shortcutName: "Vox"
  installerIcon: src/assets/Logo-Vox1.ico
  uninstallerIcon: src/assets/Logo-Vox1.ico
  installerHeaderIcon: src/assets/Logo-Vox1.ico
  installerSidebar: resources/installer/installerSidebar.bmp
  uninstallerSidebar: resources/installer/uninstallerSidebar.bmp
  installerHeader: resources/installer/installerHeader.bmp
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**/*"
