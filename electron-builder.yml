appId: com.vox.app
productName: Vox
directories:
  output: dist-build
files:
  - "out/**/*"
extraResources:
  - from: resources/models/
    to: models/
    filter: ["**/*"]
  - from: src/assets/Logo-Vox1.ico
    to: Logo-Vox1.ico
win:
  icon: src/assets/Logo-Vox1.ico
  signAndEditExecutable: false
  target:
    - dir
    - nsis
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**/*"
